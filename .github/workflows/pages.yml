name: Publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-branch
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build static site
        run: npm run build:pages

      - name: Checkout publication branch
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: published

      - name: Update publication branch
        run: rsync -a --delete --exclude '.git/' .gh-pages/ published/

      - name: Push publication branch
        working-directory: published
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Publication branch is already up to date."
            exit 0
          fi
          git commit -m "Publish ${GITHUB_SHA}"
          git push origin gh-pages
